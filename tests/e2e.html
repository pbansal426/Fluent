<!doctype html>
<!-- End-to-end check with the real model: the agent, the page scripts and a real form, minus speech
     and chrome.* APIs. Two cases:
       node tests/run-harness.mjs "http://127.0.0.1:8765/tests/e2e.html" out.png            Spanish speaker, English web form
       node tests/run-harness.mjs "http://127.0.0.1:8765/tests/e2e.html?case=w2" out.png    English speaker, Spanish W-2 PDF
     (the w2 case needs fw2_es.pdf in the repo root, which is not in git)
     Other query options: &model=google/gemma-4-e4b&base=http://localhost:1234/v1 -->
<meta charset="utf-8">
<title>Fluent end-to-end</title>
<iframe id="page" style="width:1100px;height:2300px;border:0"></iframe>
<pre id="out">running</pre>
<script type="module">
import { createClient } from '../extension/lib/llm.js';
import { Agent } from '../extension/lib/agent.js';
import { translatePhrases } from '../extension/lib/prompts.js';

const q = new URLSearchParams(location.search);
const SSN = '123-45-6789';

// What the user says for each field (keyed by the start of the form's own label), what they type into
// private or long fields, and what the finished form must look like.
const CASES = {
  intake: {
    src: '../demo/intake.html',
    userLang: 'Spanish',
    skip: 'saltar, no lo sé',
    answers: {
      'Legal first name': ['Me llamo María Elena López García y nací el 3 de marzo de 1998'],
      'Legal last name': ['López García'],
      'Date of birth': ['el 3 de marzo de 1998'],
      'Sex assigned': ['mujer'],
      'Marital status': ['estoy casada'],
      'Mobile phone': ['217 555 0198'],
      'Email address': ['maria punto lopez arroba gmail punto com'],
      'Street address': ['742 calle Green, apartamento 3'],
      City: ['Urbana'],
      Occupation: ['soy cocinera en un restaurante'],
      'Preferred language': ['español'],
      'Interpreter needed': ['sí, por favor'],
      'Insurance provider': ['no tengo seguro'],
      'Full name': ['mi esposo, Carlos López, y su teléfono es 217 555 0147'],
      'Relationship to patient': ['es mi esposo'],
      'Phone number': ['217 555 0147'],
      'Do you have any allergies': ['sí, soy alérgica a la penicilina'],
      'If yes, list': ['penicilina'],
      'Do you currently smoke': ['nunca he fumado'],
      'Current medications': ['¿qué significa eso?', 'no tomo ninguno'],
      'I have read': ['sí, estoy de acuerdo'],
    },
    typed: {
      'Social Security Number': { value: SSN },
      'Member ID number': { value: '' },
      "Reason for today's visit": { value: 'Tengo dolor de cabeza y fiebre desde hace tres días.', translate: true },
    },
    checks: (v) => ({
      'ssn typed on page': v('Social Security Number') === SSN,
      date: v('Date of birth') === '1998-03-03',
      'select translated': v('Marital status') === 'Married' && v('Sex assigned') === 'Female',
      consent: v('I have read') === 'true',
      'form language detected': (formLang) => /english/i.test(formLang),
    }),
  },
  w2: {
    src: '../extension/pdf/viewer.html?file=/fw2_es.pdf',
    userLang: 'English',
    skip: 'skip this one',
    answers: {
      'd Número de control': ["I don't know what that is", "I'm not sure, what should I put?"],
      'e Primer nombre': ['My name is Maria E. Lopez'],
      '7 Propinas': ['what do people usually put here?'],
      Apellido: ['Lopez'],
      '1 Salarios': ['my wages were 52000 dollars and the federal income tax withheld was 6100'],
      '2 Impuesto federal': ['6100'],
      '3 Salarios para': ['what does this box mean?', '52000'],
      '4 Impuesto del seguro': ['3224'],
      '5 Salarios y propinas': ['52000'],
      '6 Impuesto de Medicare': ['754'],
      'Empleado estatutario': ['no'],
      'Plan de jubilación': ['yes'],
      '15 Estado': ['Illinois'],
      '16 Salarios estatales': ['52000'],
      '17 Impuesto estatal': ['2574'],
    },
    typed: {
      'a Núm. de seguro social': { value: SSN },
      'b Núm. de identificación': { value: '12-3456789' },
      'c Nombre, dirección': { value: 'Lakeside Family Clinic\n1420 W Harbor St\nChampaign, IL 61820' },
      'f Dirección y código postal': { value: '742 Green St Apt 3\nUrbana, IL 61801' },
    },
    checks: (v, typedLabels) => ({
      'ssn typed on page': v('a Núm. de seguro social') === SSN,
      'spanish ssn and ein treated as private': typedLabels.some((l) => l.startsWith('a Núm.')) && typedLabels.some((l) => l.startsWith('b Núm.')),
      'names from one sentence': /maria/i.test(v('e Primer nombre')) && /lopez/i.test(v('Apellido')),
      'two boxes from one sentence': /52,?000/.test(v('1 Salarios')) && /6,?100/.test(v('2 Impuesto federal')),
      'social security wages spoken, not typed': /52,?000/.test(v('3 Salarios para')) && !typedLabels.some((l) => l.startsWith('3 ')),
      checkboxes: v('Empleado estatutario') === '' && v('Plan de jubilación') === 'true',
      // Interpret only: when the user gives no answer, nothing may appear in the field.
      'nothing invented when the user gave no answer': v('d Número de control') === '' && v('7 Propinas') === '' && v('8 Propinas') === '' && v('12a') === '',
      'form language detected': (formLang) => /spanish/i.test(formLang),
    }),
  },
};

const testCase = CASES[q.get('case') || 'intake'];
const userLang = q.get('lang') || testCase.userLang;
const frame = document.getElementById('page');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const load = (doc, src) => new Promise((resolve, reject) => {
  const s = doc.createElement('script');
  s.src = src; s.onload = resolve; s.onerror = reject;
  doc.head.appendChild(s);
});
const find = (map, label) => Object.entries(map).find(([k]) => label.startsWith(k))?.[1];

async function run() {
  const out = { case: q.get('case') || 'intake', lang: userLang, transcript: [], turns: [], errors: [] };
  const doc = frame.contentDocument;
  const win = frame.contentWindow;
  if (!win.__fluent?.scan) for (const f of ['scan', 'overlay', 'fill']) await load(doc, `../extension/content/${f}.js`);
  const F = win.__fluent;
  for (let i = 0; i < 100 && F.pdfReady === false; i++) await sleep(200); // the PDF viewer needs time to draw
  const page = {
    scan: async () => F.scan(), apply: async (t) => F.apply(t), highlight: async (id) => F.highlight(id),
    focus: async (id) => F.focus(id), fill: async (id, v) => F.fill(id, v), read: async (id) => F.read(id),
  };

  const sent = [];
  const base = createClient({ baseUrl: q.get('base') || 'http://localhost:1234/v1', model: q.get('model') || 'google/gemma-4-e4b' });
  const llm = {
    chat: (o) => { sent.push(JSON.stringify(o.messages)); return base.chat(o); },
    chatJson: (o) => { sent.push(JSON.stringify(o.messages)); return base.chatJson(o); },
  };
  const ui = {
    say: async (t) => void out.transcript.push(`AGENT: ${t}`),
    prompt: () => {}, status: () => {},
    filled: (items) => out.transcript.push(`  ✓ ${items.map((i) => `${i.original} = ${i.value}`).join(' | ')}`),
    error: (e) => out.errors.push(String(e?.message || e)),
  };

  let t0 = performance.now();
  const phrases = await translatePhrases(llm, userLang);
  out.phrasesMs = Math.round(performance.now() - t0);

  const agent = new Agent({ llm, page, ui, userLang, phrases });
  t0 = performance.now();
  await agent.start();
  out.firstQuestionMs = Math.round(performance.now() - t0);

  const used = {};
  const typedLabels = [];
  for (let step = 0; step < 90 && agent.mode !== 'done' && agent.current; step++) {
    const field = agent.current;
    console.log(`step ${step}: ${agent.mode} "${field.label}"`);
    if (agent.mode === 'type') {
      const typed = find(testCase.typed, field.label) || { value: '' };
      const el = doc.querySelector(`[data-fluent-id="${field.id}"]`);
      el.value = typed.value;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      typedLabels.push(field.label);
      out.transcript.push(`USER TYPES in "${field.label}": ${field.sensitive ? '(private)' : typed.value}`);
      if (typed.translate) {
        await agent.translateTyped();
        out.transcript.push(`  translated -> ${el.value}`);
      }
      await agent.continueTyped();
      continue;
    }
    const answers = find(testCase.answers, field.label) || [];
    const n = (used[field.id] = (used[field.id] || 0) + 1);
    const text = answers[n - 1] || testCase.skip;
    out.transcript.push(`USER: ${text}`);
    t0 = performance.now();
    await agent.handleUser(text);
    out.turns.push(Math.round(performance.now() - t0));
  }
  await agent.translating;

  // Final value of each field, read from the page itself.
  const value = (labelStart) => {
    const field = agent.fields.find((f) => f.label.startsWith(labelStart));
    const el = field && doc.querySelector(`[data-fluent-id="${field.id}"]`);
    if (!el) return undefined;
    if (el.type === 'checkbox') return el.checked ? 'true' : '';
    if (el.type === 'radio') return doc.querySelector(`input[name="${el.name}"]:checked`)?.value || '';
    return el.tagName === 'SELECT' ? el.value : el.value;
  };
  out.form = Object.fromEntries(agent.fields.map((f) => [f.label, f.sensitive ? '(private)' : value(f.label)]).filter(([, v]) => v));
  out.mode = agent.mode;
  out.formLang = agent.formLang;
  out.fieldCount = agent.fields.length;
  out.badges = doc.querySelectorAll('[data-fluent-badge]').length;
  const sorted = [...out.turns].sort((a, b) => a - b);
  out.turnMs = { median: sorted[Math.floor(sorted.length / 2)], max: sorted.at(-1) };

  const checks = { finished: agent.mode === 'done', 'ssn never sent to model': !sent.some((s) => s.includes(SSN)), 'no errors': out.errors.length === 0 };
  for (const [name, result] of Object.entries(testCase.checks(value, typedLabels))) checks[name] = typeof result === 'function' ? result(agent.formLang) : result;
  out.checks = checks;
  out.summary = `${Object.values(checks).filter(Boolean).length}/${Object.keys(checks).length} passed`;
  return out;
}

async function main() {
  let out;
  try { out = await run(); } catch (e) { out = { error: String(e?.stack || e), summary: '0/1 passed' }; }
  document.getElementById('out').textContent = JSON.stringify(out, null, 1);
}
frame.addEventListener('load', main, { once: true });
frame.src = testCase.src;
</script>
